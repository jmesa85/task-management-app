<div class="task-list">
  <h2 class="task-list__title">Tasks</h2>

  <a class="task-list__add-btn" routerLink="/tasks/new">+ Add Task</a>

  @if (tasks().length === 0) {
    <p class="task-list__empty">No tasks found.</p>
  }

  <div class="task-list__items">
    @for (task of tasks(); track task.id) {
      <app-task
        [task]="task"
        (toggleComplete)="onToggleComplete($event)"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      />
      @if (editingTaskId() === task.id) {
        <app-task-state-form
          [task]="task"
          (stateChanged)="onStateChanged()"
          (cancelled)="onStateFormCancelled()"
        />
      }
    }
  </div>

  @if (totalPages() > 1) {
    <div class="task-list__pagination">
      <button
        class="task-list__pagination-btn"
        [disabled]="!hasPreviousPage()"
        (click)="previousPage()"
      >
        Previous
      </button>
      <span class="task-list__pagination-info">
        Page {{ currentPage() }} of {{ totalPages() }}
      </span>
      <button
        class="task-list__pagination-btn"
        [disabled]="!hasNextPage()"
        (click)="nextPage()"
      >
        Next
      </button>
    </div>
  }
</div>
